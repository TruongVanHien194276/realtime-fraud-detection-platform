[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-fraud-detection-platform"
version = "0.1.0"
description = "Near-real-time fraud detection data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==23.0.1",
    "pydantic==2.14.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
