global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fraud_exporter
    static_configs:
      - targets: ["fraud_exporter:9109"]
  - job_name: fraud_api
    static_configs:
      - targets: ["api:8000"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
