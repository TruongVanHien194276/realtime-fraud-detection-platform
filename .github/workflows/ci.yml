name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --no-cache .
      - run: ruff format --check .
      - run: pytest -q tests/unit --ignore=tests/unit/test_week8_api.py --ignore=tests/unit/test_week10_api_timeout.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose pins ARM64 for the local M3. Build the Dockerfile natively on CI.
      - run: docker build -f Dockerfile.api -t fraud-api-ci .
      - run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PYTHONPATH=/workspace/src \
            fraud-api-ci \
            pytest -q tests/unit/test_week8_api.py tests/unit/test_week10_api_timeout.py
