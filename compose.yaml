services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: linux/arm64
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
    mem_limit: 1g
    cpus: 2
    stdin_open: true
    tty: true

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    platform: linux/arm64
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_DIRS: /workspace/data/tmp/spark
      # Dùng khi chạy pytest trực tiếp bằng Python.
      PYSPARK_SUBMIT_ARGS: "--jars /opt/iceberg/iceberg-spark-runtime.jar pyspark-shell"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 2700m
    cpus: 2
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    profiles: ["warehouse"]
    environment:
      POSTGRES_DB: fraud_dw
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
      - ./sql/warehouse/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_dw"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m
    cpus: 1
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    platform: linux/arm64
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    volumes:
      - fraud_redpanda:/var/lib/redpanda/data
    mem_limit: 768m
    cpus: 1

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    platform: linux/arm64
    profiles: ["streaming"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
    mem_limit: 256m
    cpus: 1

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    platform: linux/arm64
    profiles: ["warehouse"]
    working_dir: /workspace/dbt
    volumes:
      - .:/workspace
    environment:
      DBT_PROFILES_DIR: /workspace/dbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 768m
    cpus: 2
  redis:
    image: redis:7.4-alpine
    platform: linux/arm64
    profiles: ["rules"]
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 128m
    cpus: 1

  rules:
    build:
      context: .
      dockerfile: Dockerfile.rules
    platform: linux/arm64
    profiles: ["rules"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: fraud
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: fraud_dw
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: redpanda:9092
    mem_limit: 384m
    cpus: 1

  bi:
    build:
      context: .
      dockerfile: Dockerfile.bi
    platform: linux/arm64
    profiles: ["bi"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: fraud
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: fraud_dw
      PYTHONPATH: /workspace/src
    mem_limit: 768m
    cpus: 2

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    platform: linux/arm64
    profiles: ["ml"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    mem_limit: 2g
    cpus: 2

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/arm64
    profiles: ["api"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      MLFLOW_TRACKING_URI: sqlite:////workspace/data/ml/week7/mlflow.db
      MODEL_NAME: fraud-risk-safe
      MODEL_ALIAS: champion
      RULES_PATH: /workspace/config/rules-v1.yaml
      REDIS_URL: redis://redis:6379/0
      MODEL_REVIEW_AT: "0.9546722331383121"
      ALLOW_MODEL_BLOCK: "false"
      MODEL_BLOCK_AT: "0.99"
      FALLBACK_MODE: rule_only
    ports:
      - "127.0.0.1:8002:8000"
    mem_limit: 1400m
    cpus: 2

  fraud_exporter:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    platform: linux/arm64
    profiles: ["monitoring"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: fraud
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: fraud_dw
      FRAUD_RUN_ID: week5-smoke-v1
    ports:
      - "127.0.0.1:9109:9109"
    mem_limit: 128m
    cpus: 1

  prometheus:
    image: prom/prometheus:v3.6.0
    platform: linux/arm64
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=4h
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fraud_promdata:/prometheus
    ports:
      - "127.0.0.1:9099:9090"
    mem_limit: 256m
    cpus: 1

  grafana:
    image: grafana/grafana:12.2.0
    platform: linux/arm64
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://grafana_renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3009:3000"
    mem_limit: 256m
    cpus: 1

  grafana_renderer:
    image: grafana/grafana-image-renderer@sha256:a643fd3ee669ff1b6927d5589c37ee1078b52fc76cea9a7bf8e247357e9d9dd1
    platform: linux/arm64
    profiles: ["monitoring-render"]
    environment:
      GOMEMLIMIT: 256MiB
      BROWSER_WS_URL_READ_TIMEOUT: 60s
    mem_limit: 1024m
    cpus: 2

volumes:
  fraud_pgdata:
  fraud_redpanda:
  fraud_promdata:
